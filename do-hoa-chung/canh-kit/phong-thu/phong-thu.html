<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* phòng chiếu tối: khung video là nhân vật chính, mọi thứ quanh nó lùi lại */
  :root {
    --nen: #0b0d16;
    --mat: #131726;
    --vien: #262b40;
    --chu: #e9ecf4;
    --chu-phu: #969db4;
    --nhan: #5cc2f7;
    --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--nen); color: var(--chu); font-family: var(--font); font-size: 15px; line-height: 1.55; }
  .vo { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .mo { margin: 0; color: var(--chu-phu); max-width: 68ch; }
  .dieu-khien { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
  .nhom { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .nhom > span { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--chu-phu); margin-right: 4px; }
  .nhom button { font: inherit; font-size: 14px; color: var(--chu); background: var(--mat); border: 1px solid var(--vien);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .nhom button[aria-pressed="true"] { border-color: var(--nhan); color: var(--nhan); background: color-mix(in srgb, var(--nhan) 12%, var(--mat)); }
  .nhom button:focus-visible { outline: 2px solid var(--nhan); outline-offset: 2px; }
  .man { background: #05060b; border: 1px solid var(--vien); border-radius: 14px; overflow: hidden; display: flex; justify-content: center; }
  .man iframe { display: block; border: 0; width: 100%; max-width: 100%; background: #05060b; }
  .ghi-chu { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .ghi-chu section { background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .ghi-chu h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .ghi-chu p { margin: 0; color: var(--chu-phu); font-size: 14px; }
  .chan { color: var(--chu-phu); font-size: 13px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="vo">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>__TITLE__</h1>
    <p class="mo">Bản xem thử cảnh minh hoạ: cùng một file vừa chạy ngay ở đây, vừa chụp từng khung ra video cho xưởng. Bấm để đổi họ màu, khung và cách chèn, tua thanh dưới khung để xem từng nhịp, rồi góp ý theo mốc giây.</p>
  </header>

  <div class="dieu-khien" role="group" aria-label="Tuỳ chọn xem">
    <div class="nhom" id="nhom-theme"><span>Họ màu</span>
      <button type="button" id="th-dem" data-v="dem" aria-pressed="true">Đêm xanh</button>
      <button type="button" id="th-than" data-v="than" aria-pressed="false">Than đồng</button>
      <button type="button" id="th-giay" data-v="giay" aria-pressed="false">Giấy mực</button>
    </div>
    <div class="nhom" id="nhom-khung"><span>Khung</span>
      <button type="button" id="kh-ngang" data-v="ngang" aria-pressed="true">Ngang 16:9</button>
      <button type="button" id="kh-doc" data-v="doc" aria-pressed="false">Dọc 9:16</button>
    </div>
    <div class="nhom" id="nhom-nen"><span>Cách chèn</span>
      <button type="button" id="nen-khong" data-v="" aria-pressed="true">Toàn khung</button>
      <button type="button" id="nen-mo" data-v="mo" aria-pressed="false">Nền là khung hình mờ</button>
      <button type="button" id="nen-pip" data-v="pip" aria-pressed="false">Chừa góc cho người nói</button>
    </div>
  </div>

  <div class="man"><iframe id="canh" title="__TITLE__"></iframe></div>
  <p class="chan">__CHAN__</p>
</div>

<script>
(function () {
  const GOI = '__GOI__';
  const NEN = '__NEN__';
  const bytes = Uint8Array.from(atob(GOI), (c) => c.charCodeAt(0));
  const nguon = new TextDecoder('utf-8').decode(bytes);
  const tt = {theme: 'dem', khung: 'ngang', nen: ''};
  const khungEl = document.getElementById('canh');

  function dung() {
    let h = nguon.replace(/data-theme="[^"]*"/, `data-theme="${tt.theme}"`).replace(/data-khung="[^"]*"/, `data-khung="${tt.khung}"`);
    if (tt.nen === 'pip') h = h.replace(/<html([^>]*)>/, '<html$1 data-pip="1">');
    else if (tt.nen && NEN.length > 30) h = h.replace(/(<div class="san"[^>]*>)/, `$1<div class="nen-anh" style="background-image:url(${NEN})"></div><div class="nen-phu"></div>`);
    khungEl.srcdoc = h;
    coGian();
  }
  function coGian() {
    const w = khungEl.parentElement.clientWidth;
    if (tt.khung === 'ngang') { khungEl.style.width = '100%'; khungEl.style.height = Math.round(w * 9 / 16 + 56) + 'px'; }
    else {
      const h = Math.min(Math.round(window.innerHeight * 0.82), 900);
      const ww = Math.min(w, Math.round((h - 56) * 9 / 16));
      khungEl.style.width = ww + 'px'; khungEl.style.height = Math.round(ww * 16 / 9 + 56) + 'px';
    }
  }
  function nhom(id, khoa) {
    const g = document.getElementById(id);
    g.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      tt[khoa] = b.dataset.v; dung();
    });
  }
  if (NEN.length < 30) document.getElementById('nen-mo').hidden = true;
  if (!/class="o-pip/.test(nguon)) document.getElementById('nen-pip').hidden = true;
  nhom('nhom-theme', 'theme'); nhom('nhom-khung', 'khung'); nhom('nhom-nen', 'nen');
  addEventListener('resize', coGian);
  dung();
})();
</script>
